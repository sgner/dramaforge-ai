<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DramaForge AI - AI Short Drama Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                950: '#ffffff',
                900: '#f8fafc',
                800: '#f1f5f9',
                700: '#e8edf3',
                600: '#111827',
                500: '#374151',
                400: '#64748b',
                300: '#94a3b8',
              },
              accent: {
                600: '#1e40af',
                500: '#2563eb',
                400: '#3b82f6',
                300: '#60a5fa',
              }
            },
            fontFamily: {
              display: ['Inter', 'system-ui', 'sans-serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'fade-in': 'fadeIn 0.4s ease-out forwards',
              'fade-in-up': 'fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'shimmer': 'shimmer 2s linear infinite',
              'spin-slow': 'spin 2s linear infinite',
              'page-enter': 'pageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { transform: 'translateY(12px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.96)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideInRight: {
                '0%': { transform: 'translateX(30px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              pageEnter: {
                '0%': { transform: 'translateY(8px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg: #f8fafc;
        --bg-soft: #ffffff;
        --surface: #ffffff;
        --surface-2: #f1f5f9;
        --border: #e8edf3;
        --border-light: #cbd5e1;
        --text: #111827;
        --text-muted: #64748b;
        --text-faint: #94a3b8;
        --accent: #111827;
        --accent-light: #374151;
        --accent-soft: rgba(17, 24, 39, 0.06);
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #dc2626;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(17, 24, 39, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(17, 24, 39, 0.25);
      }

      /* ── Glass ── */
      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border: 1px solid rgba(17, 24, 39, 0.06);
      }
      .glass-hover:hover {
        background: rgba(255, 255, 255, 0.95);
        border-color: rgba(17, 24, 39, 0.12);
      }

      /* ── Gradient text ── */
      .gradient-text {
        background: linear-gradient(135deg, #111827, #374151, #111827);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .gradient-text-animated {
        background: linear-gradient(135deg, #111827, #374151, #111827);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Buttons ── */
      .btn-press {
        transition: all 0.15s var(--ease);
      }
      .btn-press:active {
        transform: scale(0.97);
      }

      /* ── Cards ── */
      .card-glow {
        transition: box-shadow 0.3s var(--ease), border-color 0.3s var(--ease), transform 0.3s var(--ease);
      }
      .card-glow:hover {
        box-shadow: 0 0 0 1px rgba(17, 24, 39, 0.08), 0 12px 40px rgba(0, 0, 0, 0.08);
      }

      .hover-lift {
        transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      }

      /* ── Status dots ── */
      .status-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 6px;
        flex-shrink: 0;
      }
      .status-dot-idle { background: #94a3b8; }
      .status-dot-processing { background: #2563eb; animation: statusPulse 1.5s ease-in-out infinite; }
      .status-dot-completed { background: #16a34a; }
      .status-dot-failed { background: #dc2626; }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.4); }
      }

      /* ── Shimmer ── */
      .shimmer-bg {
        background: linear-gradient(90deg, transparent 0%, rgba(17, 24, 39, 0.04) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shimmer 3s linear infinite;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .skeleton {
        background: linear-gradient(90deg, rgba(17, 24, 39, 0.04) 25%, rgba(17, 24, 39, 0.08) 50%, rgba(17, 24, 39, 0.04) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 8px;
      }

      .progress-bar-animated {
        position: relative;
        overflow: hidden;
      }
      .progress-bar-animated::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        animation: shimmer 2s linear infinite;
      }

      /* ── Stagger ── */
      .stagger-1 { animation-delay: 0.05s; }
      .stagger-2 { animation-delay: 0.1s; }
      .stagger-3 { animation-delay: 0.15s; }
      .stagger-4 { animation-delay: 0.2s; }
      .stagger-5 { animation-delay: 0.25s; }
      .stagger-6 { animation-delay: 0.3s; }
      .stagger-7 { animation-delay: 0.35s; }
      .stagger-8 { animation-delay: 0.4s; }

      /* ── Custom scrollbar ── */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(17, 24, 39, 0.1);
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(17, 24, 39, 0.2);
      }

      /* ── Toast ── */
      .toast-notification {
        position: fixed;
        top: 80px;
        right: 24px;
        z-index: 200;
        pointer-events: auto;
      }
      .toast-enter {
        animation: toastEnter 0.3s var(--ease) forwards;
      }
      @keyframes toastEnter {
        0% { transform: translateX(80px) scale(0.95); opacity: 0; }
        100% { transform: translateX(0) scale(1); opacity: 1; }
      }
      .toast-exit {
        animation: toastExit 0.25s ease-in forwards;
      }
      @keyframes toastExit {
        0% { transform: translateX(0) scale(1); opacity: 1; }
        100% { transform: translateX(80px) scale(0.95); opacity: 0; }
      }

      /* ── Page transition ── */
      .page-transition-enter {
        animation: pageEnter 0.4s var(--ease) forwards;
      }
      @keyframes pageEnter {
        0% { transform: translateY(8px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }

      /* ── Processing dots ── */
      .processing-dots::after {
        content: '';
        animation: processingDots 1.5s steps(4, end) infinite;
      }
      @keyframes processingDots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
      }

      /* ── Stream steps ── */
      .stream-step-enter {
        animation: fadeInUp 0.3s var(--ease) forwards;
      }
      .stream-glow-line {
        position: relative;
      }
      .stream-glow-line::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(to bottom, rgba(17, 24, 39, 0.3), rgba(17, 24, 39, 0.06), transparent);
        border-radius: 1px;
      }

      /* ── Slide animations ── */
      .slide-in-right {
        animation: slideInRight 0.3s var(--ease) forwards;
      }
      @keyframes slideInRight {
        0% { transform: translateX(30px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      .slide-in-left {
        animation: slideInLeft 0.3s var(--ease) forwards;
      }
      @keyframes slideInLeft {
        0% { transform: translateX(-30px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }

      /* ── Typing cursor ── */
      .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #111827;
        animation: typingBlink 0.8s step-end infinite;
        vertical-align: text-bottom;
        margin-left: 1px;
      }
      @keyframes typingBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* ── Celebration ── */
      .celebration-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        overflow: hidden;
      }
      .celebration-sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
      }
      .celebration-ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(17, 24, 39, 0.4);
        pointer-events: none;
        animation: celebrationRing 1s var(--ease) forwards;
      }
      @keyframes celebrationRing {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(3); opacity: 0; }
      }
      @keyframes sparkleBurst {
        0% { transform: scale(1); opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes celebrationRise {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
      }

      /* ── Tree connector ── */
      .tree-connector {
        position: absolute;
        background-color: rgba(17, 24, 39, 0.08);
        z-index: 0;
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  <!-- Vite handles module resolution in dev/build -->
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
