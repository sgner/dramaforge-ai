<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DramaForge AI - AI Short Drama Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind Play CDN 改成 defer + 异步加载，不阻塞首屏渲染。
         原来放 head 是 blocking，会在 DOMContentLoaded 之前下载 1.5MB+ 的
         Tailwind 编译器并扫描所有 DOM 重新生成 CSS class，导致首屏卡 3-10s。
         现在 React mount 后再加载 Tailwind，UI 先用 style.css 的 fallback 渲染，
         Tailwind 接管只是 class 重写（视觉上无缝切换）。 -->
    <script defer src="https://cdn.tailwindcss.com" onload="window.__tailwindLoaded=true"></script>
    <script>
      window.__tailwindReady = new Promise((resolve) => {
        if (window.__tailwindLoaded) { resolve(); return; }
        const check = setInterval(() => {
          if (window.tailwind) { clearInterval(check); resolve(); }
        }, 50);
      });
      window.__tailwindReady.then(() => {
        window.tailwind.config = {
          theme: {
            extend: {
              colors: {
                // Runway 暗色 token 集（brief §1）
                ink: '#0A0A0B',
                panel: {
                  DEFAULT: '#131316',
                  2: '#1A1A1F',
                },
                line: 'rgba(255,255,255,0.07)',
                // 保留 brand-* 名称，映射到新暗色值，减少改动面
                brand: {
                  950: '#050506',
                  900: '#0A0A0B',
                  800: '#131316',
                  700: '#1A1A1F',
                  600: '#6E6BF2',
                  500: '#817FF5',
                  400: 'rgba(255,255,255,0.45)',
                  300: 'rgba(255,255,255,0.28)',
                },
                accent: {
                  600: '#5B58E0',
                  500: '#6E6BF2',
                  400: '#817FF5',
                  300: '#A5A3F8',
                }
              },
              fontFamily: {
                display: ['Inter', 'system-ui', 'sans-serif'],
                sans: ['Inter', 'system-ui', 'sans-serif'],
                mono: ['JetBrains Mono', 'monospace'],
              },
              animation: {
                'fade-in': 'fadeIn 0.4s ease-out forwards',
                'fade-in-up': 'fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                'slide-in-right': 'slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                'shimmer': 'shimmer 2s linear infinite',
                'spin-slow': 'spin 2s linear infinite',
                'page-enter': 'pageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              },
              keyframes: {
                fadeIn: {
                  '0%': { opacity: '0' },
                  '100%': { opacity: '1' },
                },
                fadeInUp: {
                  '0%': { transform: 'translateY(12px)', opacity: '0' },
                  '100%': { transform: 'translateY(0)', opacity: '1' },
                },
                scaleIn: {
                  '0%': { transform: 'scale(0.96)', opacity: '0' },
                  '100%': { transform: 'scale(1)', opacity: '1' },
                },
                slideUp: {
                  '0%': { transform: 'translateY(20px)', opacity: '0' },
                  '100%': { transform: 'translateY(0)', opacity: '1' },
                },
                slideInRight: {
                  '0%': { transform: 'translateX(30px)', opacity: '0' },
                  '100%': { transform: 'translateX(0)', opacity: '1' },
                },
                shimmer: {
                  '0%': { backgroundPosition: '-200% 0' },
                  '100%': { backgroundPosition: '200% 0' },
                },
                pageEnter: {
                  '0%': { transform: 'translateY(8px)', opacity: '0' },
                  '100%': { transform: 'translateY(0)', opacity: '1' },
                },
              }
            }
          }
        };
      });
    </script>
    <style>
      :root {
        /* Runway 暗色设计令牌（brief §1）；页面底随 WebGL 背景基调下沉到 #040406 */
        --bg: #040406;
        --bg-soft: #131316;
        --surface: #131316;
        --surface-2: #1A1A1F;
        --border: rgba(255, 255, 255, 0.07);
        --border-light: rgba(255, 255, 255, 0.12);
        --text: #F5F5F7;
        --text-muted: rgba(255, 255, 255, 0.45);
        --text-faint: rgba(255, 255, 255, 0.28);
        --accent: #6E6BF2;
        --accent-light: #817FF5;
        --accent-soft: rgba(110, 107, 242, 0.14);
        --success: #3ECF8E;
        --warning: #F5B544;
        --danger: #F26161;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      /* 首屏兜底必须暗色：Tailwind CDN 异步加载前的 fallback 渲染不能白闪 */
      html {
        background-color: #040406;
      }

      body {
        background-color: #040406;
        color: #F5F5F7;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* ── Glass ── */
      .glass {
        background: rgba(19, 19, 22, 0.82);
        backdrop-filter: blur(16px) saturate(1.2);
        -webkit-backdrop-filter: blur(16px) saturate(1.2);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }
      .glass-hover:hover {
        background: rgba(26, 26, 31, 0.95);
        border-color: rgba(255, 255, 255, 0.14);
      }

      /* ── Suno 暖色 CTA：琥珀→橙红→品红渐变，内高光 + 柔光 ── */
      .cta-primary {
        background: linear-gradient(135deg, #FF8A3D 0%, #FF5C39 48%, #F43F5E 100%);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 2px 14px rgba(255, 92, 57, 0.28);
        transition: filter 0.2s ease, box-shadow 0.3s ease, transform 0.15s ease;
      }
      .cta-primary:hover {
        filter: brightness(1.1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 4px 34px rgba(255, 92, 57, 0.48);
      }

      /* ── 暖色渐变进度/装饰条 ── */
      .warm-gradient-bar {
        background: linear-gradient(90deg, #FF8A3D, #FF5C39 55%, #F43F5E);
      }

      /* ── 暖色渐变文字（hero 大标题高亮词） ── */
      .warm-gradient-text {
        background: linear-gradient(120deg, #FFB37A 0%, #FF6B4A 45%, #F43F5E 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* ── Gradient text ── */
      .gradient-text {
        background: linear-gradient(135deg, #F5F5F7, #A5A3F8, #F5F5F7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .gradient-text-animated {
        background: linear-gradient(135deg, #F5F5F7, #A5A3F8, #F5F5F7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Buttons ── */
      .btn-press {
        transition: all 0.15s var(--ease);
      }
      .btn-press:active {
        transform: scale(0.97);
      }

      /* ── Cards ── */
      .card-glow {
        transition: box-shadow 0.3s var(--ease), border-color 0.3s var(--ease), transform 0.3s var(--ease);
      }
      .card-glow:hover {
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 12px 40px rgba(0, 0, 0, 0.45);
      }

      .hover-lift {
        transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      }

      /* ── Status dots ── */
      .status-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-right: 6px;
        flex-shrink: 0;
      }
      .status-dot-idle { background: rgba(255, 255, 255, 0.35); }
      .status-dot-processing { background: #6E6BF2; animation: statusPulse 1.5s ease-in-out infinite; }
      .status-dot-completed { background: #3ECF8E; }
      .status-dot-failed { background: #F26161; }
      @keyframes statusPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.4); }
      }

      /* ── Shimmer ── */
      .shimmer-bg {
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: shimmer 3s linear infinite;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .skeleton {
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 8px;
      }

      .progress-bar-animated {
        position: relative;
        overflow: hidden;
      }
      .progress-bar-animated::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        animation: shimmer 2s linear infinite;
      }

      /* ── Stagger ── */
      .stagger-1 { animation-delay: 0.05s; }
      .stagger-2 { animation-delay: 0.1s; }
      .stagger-3 { animation-delay: 0.15s; }
      .stagger-4 { animation-delay: 0.2s; }
      .stagger-5 { animation-delay: 0.25s; }
      .stagger-6 { animation-delay: 0.3s; }
      .stagger-7 { animation-delay: 0.35s; }
      .stagger-8 { animation-delay: 0.4s; }

      /* ── Custom scrollbar ── */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.22);
      }

      /* ── Toast ── */
      .toast-notification {
        position: fixed;
        top: 80px;
        right: 24px;
        z-index: 200;
        pointer-events: auto;
      }
      .toast-enter {
        animation: toastEnter 0.3s var(--ease) forwards;
      }
      @keyframes toastEnter {
        0% { transform: translateX(80px) scale(0.95); opacity: 0; }
        100% { transform: translateX(0) scale(1); opacity: 1; }
      }
      .toast-exit {
        animation: toastExit 0.25s ease-in forwards;
      }
      @keyframes toastExit {
        0% { transform: translateX(0) scale(1); opacity: 1; }
        100% { transform: translateX(80px) scale(0.95); opacity: 0; }
      }

      /* ── Page transition ── */
      .page-transition-enter {
        animation: pageEnter 0.4s var(--ease) forwards;
      }
      @keyframes pageEnter {
        0% { transform: translateY(8px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }

      /* ── Processing dots ── */
      .processing-dots::after {
        content: '';
        animation: processingDots 1.5s steps(4, end) infinite;
      }
      @keyframes processingDots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
        100% { content: ''; }
      }

      /* ── Stream steps ── */
      .stream-step-enter {
        animation: fadeInUp 0.3s var(--ease) forwards;
      }
      .stream-glow-line {
        position: relative;
      }
      .stream-glow-line::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(to bottom, rgba(110, 107, 242, 0.5), rgba(255, 255, 255, 0.08), transparent);
        border-radius: 1px;
      }

      /* ── Slide animations ── */
      .slide-in-right {
        animation: slideInRight 0.3s var(--ease) forwards;
      }
      @keyframes slideInRight {
        0% { transform: translateX(30px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }
      .slide-in-left {
        animation: slideInLeft 0.3s var(--ease) forwards;
      }
      @keyframes slideInLeft {
        0% { transform: translateX(-30px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }

      /* ── Typing cursor ── */
      .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #F5F5F7;
        animation: typingBlink 0.8s step-end infinite;
        vertical-align: text-bottom;
        margin-left: 1px;
      }
      @keyframes typingBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* ── Celebration ── */
      .celebration-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 100;
        overflow: hidden;
      }
      .celebration-sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        pointer-events: none;
      }
      .celebration-ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(110, 107, 242, 0.5);
        pointer-events: none;
        animation: celebrationRing 1s var(--ease) forwards;
      }
      @keyframes celebrationRing {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(3); opacity: 0; }
      }
      @keyframes sparkleBurst {
        0% { transform: scale(1); opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes celebrationRise {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
      }

      /* ── Tree connector ── */
      .tree-connector {
        position: absolute;
        background-color: rgba(255, 255, 255, 0.08);
        z-index: 0;
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  <!-- Vite handles module resolution in dev/build -->
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
